<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <title>封面｜前端开发工程师年度述职报告</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #181b24;
        color: #ffffff;
        font-family: "Noto Sans SC", system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
      }
      .slide-container {
        width: 1280px;
        height: 720px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        box-sizing: border-box;
      }
      .content-wrap {
        display: flex;
        align-items: center;
        margin-left: 100px;
      }
      .accent-bar {
        width: 8px;
        height: 220px;
        background-color: #b165fb;
        margin-right: 30px;
        flex-shrink: 0;
      }
      .text-block {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .title-line {
        font-weight: 900;
        font-size: 58px;
        line-height: 1.05;
        letter-spacing: 1px;
        margin: 0 0 16px 0;
      }
      .subtitle {
        font-weight: 500;
        font-size: 22px;
        color: #b165fb;
        margin: 0;
      }
      /* 保证整体视觉平衡，底部留出安全边距 */
      .safe-padding {
        padding-right: 100px;
        width: calc(100% - 200px);
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open%20Sans:wght@400&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Google%20Sans:wght@400&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto%20Sans%20JP:wght@400&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="">
    <div class="slide-container">
      <div class="content-wrap safe-padding">
        <div class="accent-bar"></div>
        <div class="text-block">
          <p
            class="title-line"
            style="
              position: relative;
              transform: translate(104.972px, -171.937px);
              font-size: 88px;
              text-align: right;
            "
          >
            2025年终工作总结
          </p>
          <p
            class="title-line"
            style="
              position: relative;
              transform: translate(-9.04931px, -61.5353px);
            "
          >
            Dz｜前端开发工程师
          </p>
          <p
            class="subtitle"
            style="
              position: relative;
              transform: translate(-1.80986px, -41.6268px);
            "
          >
            工作日期：2025年01月 - 2025年12月
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
